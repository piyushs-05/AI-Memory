[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory"
version = "0.1.0"
description = "Portable, user-owned AI memory service backed by an Obsidian-readable Markdown vault and SQLite FTS5"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.2",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
ai-memory = "ai_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
